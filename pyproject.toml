[project]
name = "fermentops"
version = "1.0.0"
description = "Precision calculators, batch tracking and production-sheet export for micro-batch fermentation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = [".venv", "_site"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
